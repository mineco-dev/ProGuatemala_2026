server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida devuelve index.html para que
    # react-router resuelva el enrutamiento del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre: cache agresivo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Endpoint simple para health checks de Kubernetes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
